name: Tests

on:
  push:
    branches: [main, nb-branch]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python -m unittest discover -s tests
