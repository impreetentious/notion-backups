name: Notion Backup

on:
  workflow_dispatch: {}
  schedule:
    - cron: "00 19 * * 0,4"

concurrency:
  group: notion-backup
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

# config/backup_config.json is the single authority for retention and
# compression settings; do not duplicate them as env overrides here.
env:
  BACKUP_CONFIG: config/backup_config.json

jobs:
  backup:
    name: "Monarch's Notion Backup"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show trigger context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          echo "GitHub event: ${EVENT_NAME}"
          if [ -n "${EVENT_SCHEDULE:-}" ]; then
            echo "Matched cron: ${EVENT_SCHEDULE}"
          else
            echo "Matched cron: manual dispatch"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # rclone comes from the project's own release and is checked against its
      # published SHA-256, not from the runner image's package repository: a
      # scheduled run months from now then moves the same bytes as the run this
      # workflow was tested against.
      - name: Install rclone
        env:
          RCLONE_VERSION: "1.68.2"
          RCLONE_SHA256: "0e6fa18051e67fc600d803a2dcb10ddedb092247fc6eee61be97f64ec080a13c"
        run: |
          set -euo pipefail
          archive="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_VERSION}/${archive}"
          echo "${RCLONE_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "${archive}"
          sudo install -m 0755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf "${archive}" "rclone-v${RCLONE_VERSION}-linux-amd64"
          rclone version

      - name: Configure Google Drive archive
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "RCLONE_CONFIG_B64 is not set; snapshots cannot be archived to Google Drive and the run will report a storage warning."
            exit 0
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"

      - name: Run backup
        id: backup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/backup_notion.py --config "$BACKUP_CONFIG"

      - name: Archive snapshots to Google Drive
        if: success()
        run: |
          set -euo pipefail
          python scripts/manage_storage.py \
            --config "$BACKUP_CONFIG" \
            --current-snapshot "${{ steps.backup.outputs.snapshot_dir }}" \
            --summary-file storage-summary.json

      - name: Notify success
        id: notify_success
        if: success()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
        run: |
          python scripts/notify.py \
            --config "$BACKUP_CONFIG" \
            --status success \
            --manifest "${{ steps.backup.outputs.manifest_path }}" \
            --storage-summary storage-summary.json \
            --message "Notion backup completed."
      - name: Notify failure
        # Do not report "backup failed" when the backup and storage steps
        # succeeded and only the success notification itself failed.
        if: failure() && steps.notify_success.outcome != 'failure'
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
        run: |
          python scripts/notify.py \
            --config "$BACKUP_CONFIG" \
            --status failure \
            --manifest "${{ steps.backup.outputs.manifest_path }}" \
            --storage-summary storage-summary.json \
            --message "Notion backup failed. Check the GitHub Actions logs."
